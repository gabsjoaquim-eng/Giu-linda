<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronograma aula Giuli</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#ffffff; --bg:#e8f2fb; --ink:#16283a; --muted:#5b6b7c; --line:#cfe0ef;
    --teal:#1f6fb5; --teal-soft:#d9eafa; --amber:#f5c53d; --amber-soft:#fff3cc; --amber-ink:#6b4d00; --rose-soft:#f0e6e0; --rose-ink:#6d4a3a;
    --day:#f7fbff; --hover:#eef5fc; --primary-hover:#175c98; --head-grad:linear-gradient(135deg,#dcecfb,#ffffff 60%);
    --radius:12px;
  }
  [data-theme=dark]{
    --paper:#16232f; --bg:#0e1822; --ink:#e6edf5; --muted:#9fb0c1; --line:#2b3d50;
    --teal:#5aa9f0; --teal-soft:#1d3a58; --amber-soft:#4a3a10; --amber-ink:#f5d77a; --rose-soft:#3f2f2b; --rose-ink:#e0b8a8;
    --day:#1b2a39; --hover:#1f3145; --primary-hover:#4694dd; --head-grad:linear-gradient(135deg,#14283c,#16232f 60%);
  }
  [data-theme=dark] .btn.primary{color:#0e1822}
  [data-theme=dark] .toast{background:#e6edf5;color:#0e1822}
  *{box-sizing:border-box}
  html,body{margin:0;overflow-x:hidden;max-width:100vw;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45}
  button,input,select,textarea{font:inherit;color:inherit;max-width:100%}
  main,section,div,p,h1,h2,h3,summary,details{min-width:0;overflow-wrap:anywhere;word-break:break-word}
  .grid>*,.rows>*{min-width:0}
  textarea,input{min-width:0}
  button{cursor:pointer}
  .top{background:var(--head-grad);border-bottom:1px solid var(--line);padding:10px 10px 0;position:sticky;top:0;z-index:5}
  .top .row1{display:flex;align-items:flex-start;gap:10px}
  .top .row1 .grow{flex:1}
  .theme{border:1px solid var(--line);background:var(--paper);border-radius:999px;width:40px;height:40px;font-size:18px;display:grid;place-items:center;flex:none}
  .top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
  .top .sub{margin:0 0 8px;color:var(--muted);font-size:13px}
  .sync{font-size:12px;color:var(--muted);margin:-4px 0 8px;display:flex;align-items:center;gap:6px}
  .sync::before{content:'';width:8px;height:8px;border-radius:50%;background:#d9534f}
  .sync.ok::before{background:#2e9e5b}
  @media print{.sync{display:none}}
  .tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px;font-size:13.5px;font-weight:600}
  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
  .btn.primary:hover{background:var(--primary-hover)}
  .btn.danger{color:#d9534f}
  .btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
  .tabs{display:flex;gap:18px}
  .tab{background:none;border:0;border-bottom:3px solid transparent;padding:4px 2px 8px;font-weight:600;color:var(--muted)}
  .tab.on{color:var(--ink);border-color:var(--teal)}
  main{padding:8px}
  .weeknav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .weeknav .range{font-weight:700;font-size:17px;margin-right:auto}
  .weeknav input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--paper)}
  .semana{width:100%;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:8px;margin-bottom:8px}
  .semana.cur{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-soft)}
  .semana h3{margin:0 0 6px;font-size:15px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .semana h3 b{font-size:19px;color:var(--teal)}
  .semana h3 span{color:var(--muted);font-weight:500}
  .semana .grid{gap:6px}
  .semana .day{background:var(--day)}
  .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:100%}
  .grid.six{grid-template-columns:repeat(6,minmax(0,1fr))}
  @media (max-width:820px){.grid,.grid.six{grid-template-columns:1fr}}
  .day{overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:8px;min-height:0}
  .day.today{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
  .day h2{margin:0 0 4px;display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:600;color:var(--muted)}
  .day h2 b{font-size:22px;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-.02em}
  .day .empty{color:var(--muted);font-size:13px;padding:2px 0}
  .aula{border-top:1px solid var(--line);padding:6px 0 5px}
  .aula:first-of-type{border-top:0}
  .aula .hora{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .aula .nome{font-weight:700;margin:1px 0 4px}
  .aula .cont{white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}
  .aula .cont.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .aula .more{background:none;border:0;padding:0;margin-top:2px;color:var(--teal);font-weight:600;font-size:13px}
  .aula .prof{overflow-wrap:anywhere}
  .aula .cont.none{color:var(--muted);font-style:italic}
  .aula .prof{font-size:12.5px;color:var(--muted);margin-top:4px}
  .aula details{margin-top:5px;font-size:12.5px}
  .aula details summary{cursor:pointer;color:var(--teal);font-weight:600}
  .aula details div{white-space:pre-wrap;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
  .tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:middle}
  .tag.aval{background:var(--amber-soft);color:var(--amber-ink)}
  .tag.fer{background:var(--rose-soft);color:var(--rose-ink)}
  .aula .edit{margin-top:6px;background:none;border:0;padding:0;color:var(--teal);font-weight:600;font-size:13px}
  /* disciplinas */
  .disc{overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin-bottom:8px}
  .disc .head{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .disc .head input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--paper)}
  .disc .head .nome{font-weight:700;font-size:16px;flex:1 1 260px}
  .disc .head .turma{flex:1 1 180px}
  .hor{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:14px}
  .hor select,.hor input{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--paper)}
  .hor input[type=time]{width:105px}
  .hor .x,.row .x{background:none;border:0;color:#d9534f;font-weight:700;padding:2px 6px}
  .rows{display:grid;grid-template-columns:120px 1.6fr 1fr 1.4fr 32px;gap:6px;align-items:start}
  .rows .h{font-size:12px;font-weight:700;color:var(--muted)}
  @media (max-width:820px){
    .rows{grid-template-columns:1fr}
    .rows .h{display:none}
    .row{border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
    .row .lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
  }
  @media (min-width:821px){.row{display:contents}.row .lbl{display:none}}
  .row input,.row textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--paper)}
  .row textarea{min-height:64px;resize:vertical;font-size:13.5px}
  .row .bib{font-size:12.5px}
  .disc .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .note{background:var(--teal-soft);border-radius:var(--radius);padding:10px;font-size:14px;line-height:1.5}
  .note b{display:block;margin-bottom:4px}
  /* modal */
  .backdrop{position:fixed;inset:0;background:rgba(20,30,40,.45);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:9}
  .backdrop.on{display:flex}
  .modal{background:var(--paper);border-radius:14px;padding:16px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 10px;font-size:16px}
  .modal label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 3px}
  .modal select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper)}
  .modal input,.modal textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper)}
  .modal textarea{min-height:90px;resize:vertical}
  .modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;z-index:10}
  .toast.on{opacity:1}
  .hidden{display:none !important}
  /* print */
  .print-title{display:none}
  @media print{
    html{--paper:#fff;--bg:#fff;--ink:#000;--muted:#444;--line:#bbb;--day:#fff;--teal:#000}
    body{background:#fff;font-size:11px}
    .top,.weeknav,.aula .edit,.disc .foot,.hor .x,.row .x,.note,#fileInput{display:none !important}
    main{padding:0;max-width:none}
    .print-title{display:block;font-size:16px;font-weight:700;margin:0 0 8px}
    .grid,.grid.six{display:grid;gap:6px}
    .grid{grid-template-columns:repeat(5,1fr)} .grid.six{grid-template-columns:repeat(6,1fr)}
    .semana{break-inside:avoid;border-color:#bbb;box-shadow:none;margin-bottom:8px;padding:8px}
    .semana h3 b{color:#000}
    .day{break-inside:avoid;border-color:#bbb;min-height:0;background:#fff}
    .day.today{box-shadow:none;border-color:#bbb}
    .aula .cont.clamp{display:block;-webkit-line-clamp:unset;overflow:visible}
    .aula .more{display:none}
    .aula details summary{display:none}
    .aula details div{display:block}
    .aula .cont{font-size:11px}
    .disc{break-inside:avoid;border-color:#bbb}
    .rows{grid-template-columns:70px 1.6fr 1fr 1.4fr 0}
    .row{display:contents}
    .row input,.row textarea{border:0;padding:0;background:none;font-size:10.5px;min-height:0;resize:none;overflow:visible;height:auto}
    .row textarea{white-space:pre-wrap}
  }
</style>
</head>
<body>
<header class="top">
  <div class="row1">
    <div class="grow">
      <h1>Cronograma aula Giuli</h1>
      <p class="sub">Importe os PDFs das disciplinas, edite o que precisar e salve em PDF ou Excel.</p>
    </div>
    <button class="theme" id="btnTheme" title="Modo escuro / claro" aria-label="Alternar modo escuro">🌙</button>
  </div>
  <div class="sync" id="sync">Conectando…</div>
  <div class="tools">
    <button class="btn primary" id="btnImport">Importar PDF / Excel</button>
    <input type="file" id="fileInput" class="hidden" accept=".pdf,.xlsx,.xls" multiple>
    <button class="btn" id="btnPdf">Salvar PDF</button>
    <button class="btn" id="btnXlsx">Salvar Excel</button>
    <button class="btn" id="btnAddDisc">Nova disciplina</button>
    <button class="btn danger" id="btnClear">Limpar tudo</button>
  </div>
  <div class="tabs">
    <button class="tab on" data-view="semana">Semanas</button>
    <button class="tab" data-view="passadas">Passadas</button>
    <button class="tab" data-view="disciplinas">Disciplinas</button>
  </div>
</header>

<main>
  <div class="print-title" id="printTitle"></div>
  <section id="viewSemana">
    <div class="weeknav">
      <span class="range" id="range"></span>
      <select id="modeW" class="btn"><option value="todas">Todas</option><option value="atual">Só a semana atual</option></select>
      <button class="btn" id="todayW">Ir para hoje</button>
    </div>
    <div id="grid"></div>
  </section>
  <section id="viewDisciplinas" class="hidden">
    <div id="discList"></div>
  </section>
</main>

<div class="backdrop" id="backdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="mTitle"></h3>
    <label>Data</label><input type="date" id="mData">
    <label>Turno</label><select id="mTurno"><option value="">—</option><option value="manha">Manhã</option><option value="tarde">Tarde</option><option value="noite">Noite</option></select>
    <label>Conteúdo da aula</label><textarea id="mCont"></textarea>
    <label>Professor(a)</label><input type="text" id="mProf">
    <label>Bibliografia</label><textarea id="mBib"></textarea>
    <div class="acts">
      <button class="btn" id="mCancel">Cancelar</button>
      <button class="btn primary" id="mSave">Salvar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===================== parser (PDF -> disciplina) ===================== */
function parseCronograma(pages, fallbackName) {
  const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
  const all = [];
  pages.forEach((p, pi) => p.items.forEach(it => {
    const s = (it.str || '').trim();
    if (!s) return;
    all.push({ x: it.x, top: it.top, y: pi * 10000 + it.top, str: s, page: pi });
  }));
  all.sort((a, b) => a.y - b.y || a.x - b.x);

  const sameLine = (a, b, tol = 4) => a.page === b.page && Math.abs(a.top - b.top) <= tol;

  // ---- table header ----
  let hData, hCont, hProf, hBib;
  for (const it of all) {
    const n = norm(it.str);
    if (n.startsWith('CONTEUDO') && !hCont) {
      const line = all.filter(o => sameLine(o, it, 6));
      hData = line.find(o => norm(o.str) === 'DATA');
      hProf = line.find(o => norm(o.str).startsWith('PROFESSOR'));
      hBib = line.find(o => norm(o.str).startsWith('BIBLIOGRAFIA'));
      if (hProf) { hCont = it; break; }
    }
  }
  if (!hCont) throw new Error('Não encontrei a tabela com as colunas DATA / CONTEÚDO / PROFESSORES neste PDF.');
  const xC = hCont.x, xP = hProf.x, xB = hBib ? hBib.x : Infinity;
  const headerY = hCont.y;

  // ---- meta ----
  const grab = (label) => {
    const it = all.find(o => norm(o.str).includes(label));
    if (!it) return '';
    const self = it.str.slice(norm(it.str).indexOf(label) + label.length).replace(/^[:\s]+/, '');
    const rest = all.filter(o => sameLine(o, it, 8) && o.x > it.x && o !== it).sort((a, b) => a.x - b.x).map(o => o.str).join(' ');
    return (self + ' ' + rest).trim();
  };
  let nome = grab('CURRICULAR');
  if (!nome) nome = grab('DISCIPLINA:');
  if (!nome) nome = fallbackName || 'Disciplina';
  const turma = grab('TURMA').split(/\s{2,}|CAMPUS/i)[0].trim();

  // ---- weekly slots (X marks) ----
  const dayNames = ['SEGUNDA', 'TERCA', 'QUARTA', 'QUINTA', 'SEXTA', 'SABADO'];
  const dayHeads = all.filter(o => o.y < headerY && dayNames.includes(norm(o.str)));
  const horarios = [];
  if (dayHeads.length) {
    const pg = dayHeads[0].page;
    all.filter(o => o.page === pg && o.y < headerY && o.y > dayHeads[0].y && norm(o.str) === 'X').forEach(xm => {
      const times = all.filter(o => sameLine(o, xm, 5) && /^\d{1,2}:\d{2}$/.test(o.str)).sort((a, b) => a.x - b.x);
      if (times.length < 2) return;
      let best = null, bd = Infinity;
      dayHeads.forEach(dh => { const d = Math.abs(dh.x - xm.x); if (d < bd) { bd = d; best = dh; } });
      horarios.push({ dia: dayNames.indexOf(norm(best.str)) + 1, inicio: times[0].str, fim: times[1].str });
    });
  }
  if (!horarios.length) {
    const t = norm(turma);
    const d = dayNames.findIndex(n => t.includes(n));
    if (d >= 0) horarios.push({ dia: d + 1, inicio: t.includes('TARDE') ? '14:00' : (t.includes('NOITE') ? '19:00' : '07:50'), fim: '' });
  }
  // merge slots per day into one range
  const byDay = {};
  horarios.forEach(h => {
    const b = byDay[h.dia] || (byDay[h.dia] = { dia: h.dia, inicio: h.inicio, fim: h.fim });
    if (h.inicio < b.inicio) b.inicio = h.inicio;
    if (h.fim > b.fim) b.fim = h.fim;
  });
  const slots = Object.values(byDay).sort((a, b) => a.dia - b.dia);

  // ---- rows ----
  const body = all.filter(o => o.y > headerY + 5 && (o.page === hCont.page || o.top >= 78));
  const col = o => o.x < xC - 6 ? 0 : o.x < xP - 6 ? 1 : o.x < xB - 6 ? 2 : 3;
  body.forEach(o => o.col = col(o));
  const dateRe = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/;
  const dates = body.filter(o => o.col === 0 && dateRe.test(o.str));
  const profs = body.filter(o => o.col === 2);
  const profStarts = [];
  profs.forEach((o, i) => { if (i === 0 || o.y - profs[i - 1].y > 22) profStarts.push(o); });

  const tops = dates.map((d, i) => {
    if (i === 0) return headerY + 5;
    const prev = dates[i - 1];
    const cand = profStarts.filter(p => p.y > prev.y + 15 && p.y <= d.y + 12);
    const t = cand.length ? Math.min(cand[0].y, d.y) : d.y;
    return t - 6;
  });

  const cellText = (items, keepBreaks) => {
    if (!items.length) return '';
    items.sort((a, b) => a.y - b.y || a.x - b.x);
    const lines = [];
    items.forEach(o => {
      const L = lines[lines.length - 1];
      if (L && Math.abs(L.y - o.y) <= 3) { L.items.push(o); }
      else lines.push({ y: o.y, items: [o] });
    });
    const gaps = lines.slice(1).map((L, i) => L.y - lines[i].y).filter(g => g < 9000).sort((a, b) => a - b);
    const lineHeight = gaps.length ? gaps[Math.floor(gaps.length / 2)] : 12;
    let out = '';
    lines.forEach((L, i) => {
      const txt = L.items.sort((a, b) => a.x - b.x).map(o => o.str).join(' ');
      if (i === 0) { out = txt; return; }
      const gap = L.y - lines[i - 1].y;
      const bigGap = gap > lineHeight * 1.6 && gap < 9000;
      const pageJump = gap >= 9000;
      out += (bigGap ? '\n' : ' ') + txt;
      if (pageJump) out = out; // continuation across pages: keep as same paragraph
    });
    return out.replace(/\s+\n/g, '\n').replace(/\n\s+/g, '\n').trim();
  };

  const aulas = dates.map((d, i) => {
    const t0 = tops[i], t1 = i + 1 < tops.length ? tops[i + 1] : Infinity;
    const rowItems = body.filter(o => o.y >= t0 && o.y < t1 && o !== d);
    const m = d.str.match(dateRe);
    let yy = m[3]; if (yy.length === 2) yy = '20' + yy;
    const iso = `${yy}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    return {
      data: iso,
      conteudo: cellText(rowItems.filter(o => o.col === 1), true),
      professor: cellText(rowItems.filter(o => o.col === 2), false).replace(/\n/g, ' '),
      bibliografia: cellText(rowItems.filter(o => o.col === 3), true)
    };
  });

  return { nome, turma, horarios: slots, aulas };
}

function parseGenerico(pages, fallbackName) {
  const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
  const MESES = { JAN: 1, FEV: 2, MAR: 3, ABR: 4, MAI: 5, JUN: 6, JUL: 7, AGO: 8, SET: 9, OUT: 10, NOV: 11, DEZ: 12 };
  const MESRE = /\bde\s+(janeiro|fevereiro|mar[cç]o|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)\b/i;
  const TURNO = { manha: ['07:50', '11:30'], tarde: ['14:00', '17:40'], noite: ['19:00', '22:30'], '': ['07:50', '11:30'] };
  const isoOf = (d, m, y) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  const periodo = t => { const n = norm(t); return /\bMANHA\b/.test(n) ? 'manha' : /\bTARDE\b/.test(n) ? 'tarde' : /\bNOITE\b/.test(n) ? 'noite' : ''; };

  // ---- lines ----
  const lines = [];
  pages.forEach((p, pi) => {
    const items = p.items.filter(i => i.str && i.str.trim()).map(i => ({ x: i.x, top: i.top, str: i.str.trim() })).sort((a, b) => a.top - b.top || a.x - b.x);
    let cur = null;
    items.forEach(i => {
      if (cur && Math.abs(cur.top - i.top) <= 3) cur.items.push(i);
      else { cur = { top: i.top, y: pi * 10000 + i.top, page: pi, items: [i] }; lines.push(cur); }
    });
  });
  lines.forEach(L => { L.items.sort((a, b) => a.x - b.x); L.text = L.items.map(i => i.str).join(' ').replace(/\s+/g, ' ').trim(); L.x = L.items[0].x; });
  const allText = lines.map(l => l.text).join('\n');
  let year = new Date().getFullYear();
  const ym = allText.match(/\b(20\d{2})\b/); if (ym) year = +ym[1];

  // ---- name ----
  const nameFrom = (limitY) => {
    let nome = '';
    const dm = allText.match(/DISCIPLINA:\s*([^\n]+)/i); if (dm) nome = dm[1].trim();
    if (!nome) {
      const first = lines.find(l => l.y < limitY && /[A-Za-z]{4,}/.test(l.text) && !/\bDATA\b|DIA DO M|UNINOVE|UNIVERSIDADE|^\d/.test(l.text));
      if (first && first.text.length < 90) nome = first.text.replace(/^TEMAS?\s*-\s*/i, '').replace(/\s*-\s*T?\d{2}\s?[A-Z]$/i, '').trim();
    }
    if (!nome) nome = (fallbackName || 'Disciplina').replace(/[_\-]+/g, ' ').replace(/\b(CRONOGRAMA|ALUNOS?|CALENDARIO|CALENDÁRIO|TURMA)\b/gi, '').replace(/\b\d{5,}\b/g, '').replace(/\s+/g, ' ').trim() || 'Disciplina';
    return nome;
  };

  // ---- helpers ----
  const dRe = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?=\D|$)/;
  const dMesRe = /^(\d{1,2})\/([A-Za-z]{3})\.?(?=\s|$)/;
  const multiRe = /^((?:\d{1,2}\s*,\s*)*\d{1,2}\s*(?:e|a)\s*\d{1,2})\s+de\s+([A-Za-zçÇ]+)\b/i;
  const numsOnly = /^(?:\d{1,2}\s*,\s*)*\d{1,2}\s*(?:e|a)\s*\d{1,2}\s*$/;
  const DROP = new Set(['SEGUNDA', 'TERCA', 'QUARTA', 'QUINTA', 'SEXTA', 'SABADO', 'DOMINGO', 'SEGUNDA-FEIRA', 'TERCA-FEIRA', 'QUARTA-FEIRA', 'QUINTA-FEIRA', 'SEXTA-FEIRA', 'SABADO-FEIRA', 'MANHA', 'TARDE', 'NOITE', 'JANEIRO', 'FEVEREIRO', 'MARCO', 'ABRIL', 'MAIO', 'JUNHO', 'JULHO', 'AGOSTO', 'SETEMBRO', 'OUTUBRO', 'NOVEMBRO', 'DEZEMBRO']);
  const clean = t => t
    .split(' ').filter(w => { const n = norm(w).replace(/[^A-Z\-]/g, ''); return !DROP.has(n); }).join(' ')
    .replace(/\bT?\d{2}\s?[A-Z]\b/g, '')
    .replace(/\bBloco de \d+ horas\b/gi, '')
    .replace(/\s+de\s*$/i, '')
    .replace(/\s+(T\/P|T|P)(\s+\d{3})?\s*$/, '')
    .replace(/\s+\d{3}\s*$/, '')
    .replace(/^[\s\-–:.]+|[\s\-–:]+$/g, '')
    .replace(/\s+/g, ' ').trim();
  const expandDays = (spec, mes) => {
    const nums = spec.split(/\s*(?:,|e|a)\s*/).map(n => +n).filter(n => n);
    const range = /\d\s*a\s*\d/.test(spec);
    const days = range && nums.length === 2 ? Array.from({ length: nums[1] - nums[0] + 1 }, (_, i) => nums[0] + i) : nums;
    return days.map(d => isoOf(d, mes, year));
  };
  const finish = (nome, aulas) => {
    const seen = new Set();
    const uniq = aulas.filter(a => { const k = a.data + a.turno + a.conteudo; if (seen.has(k)) return false; seen.add(k); return true; });
    const cnt = {};
    uniq.forEach(a => { const d = new Date(a.data + 'T12:00'); const wd = (d.getDay() + 6) % 7 + 1; const k = wd + '|' + a.turno; cnt[k] = (cnt[k] || 0) + 1; });
    const minN = Math.max(3, Math.round(uniq.length * 0.2));
    const horarios = Object.entries(cnt).filter(([, n]) => n >= minN).map(([k]) => { const [wd, tu] = k.split('|'); return { dia: +wd, turno: tu, inicio: TURNO[tu][0], fim: TURNO[tu][1] }; }).sort((a, b) => a.dia - b.dia || a.inicio.localeCompare(b.inicio));
    uniq.sort((a, b) => a.data.localeCompare(b.data) || a.turno.localeCompare(b.turno));
    return { nome, turma: '', horarios, aulas: uniq };
  };

  // ---- split lines that contain a multi-date spec in the middle ("... AV2 10 e 11 de") ----
  const midRe = /(?:^|\s)((?:\d{1,2}\s*,\s*)*\d{1,2}\s*(?:e|a)\s*\d{1,2})\s+de(?:\s+[A-Za-zçÇ]+)?\b/i;
  for (let i = 0; i < lines.length; i++) {
    const L = lines[i]; if (dRe.test(L.text) || dMesRe.test(L.text)) {
      const m = L.text.slice(10).match(midRe);
      if (m) {
        const idx = L.text.indexOf(m[1], 10);
        const L2 = { top: L.top, y: L.y + 0.01, page: L.page, items: [], text: L.text.slice(idx).trim(), x: L.x };
        L.text = L.text.slice(0, idx).trim();
        lines.splice(i + 1, 0, L2);
      }
    }
  }
  const monthNear = (i) => {
    for (let j = i; j <= Math.min(lines.length - 1, i + 3); j++) {
      const txt = (j === i ? '' : lines[j].text + ' ') + (lines[j + 1] ? lines[j + 1].text : '');
      const mm = (lines[j].text + ' ' + (lines[j + 1] ? lines[j + 1].text : '')).match(MESRE);
      if (mm) return MESES[norm(mm[1]).slice(0, 3)];
      const w = lines[j].text.split(' ')[0]; const k = norm(w).slice(0, 3);
      if (j !== i && MESES[k] && norm(w).length > 3 && ['JANEIRO', 'FEVEREIRO', 'MARCO', 'ABRIL', 'MAIO', 'JUNHO', 'JULHO', 'AGOSTO', 'SETEMBRO', 'OUTUBRO', 'NOVEMBRO', 'DEZEMBRO'].includes(norm(w))) return MESES[k];
    }
    for (let j = Math.max(0, i - 3); j < i; j++) { const mm = lines[j].text.match(MESRE); if (mm) return MESES[norm(mm[1]).slice(0, 3)]; }
    return null;
  };
  const numsStartRe = /^((?:\d{1,2}\s*,\s*)*\d{1,2}\s*(?:e|a)\s*\d{1,2})(?:\s+de)?(?=\s|$)/i;
  // ---- anchors (lines that carry a date) ----
  lines.forEach((L, i) => {
    const t = L.text; let m;
    if ((m = t.match(dRe))) { let y = m[3]; if (y.length === 2) y = '20' + y; L.datas = [isoOf(+m[1], +m[2], y)]; L.rest = t.slice(m[0].length); }
    else if ((m = t.match(dMesRe)) && MESES[norm(m[2])]) { L.datas = [isoOf(+m[1], MESES[norm(m[2])], year)]; L.rest = t.slice(m[0].length); }
    else if ((m = t.match(multiRe)) && MESES[norm(m[2]).slice(0, 3)]) { L.datas = expandDays(m[1], MESES[norm(m[2]).slice(0, 3)]); L.rest = t.slice(m[0].length); }
    else if ((m = t.match(numsStartRe)) && !/^\d{1,2}\s*[,e]\s*\d{1,2}\s*\//.test(t)) {
      const mes = monthNear(i);
      if (mes) { L.datas = expandDays(m[1], mes); L.rest = t.slice(m[0].length); }
    }
  });
  const anchors = lines.filter(l => l.datas);
  let nome = nameFrom(anchors.length ? anchors[0].y : Infinity);

  // ---- calendar-style table (month columns) ----
  if (!anchors.length) {
    const MN = ['JANEIRO', 'FEVEREIRO', 'MARCO', 'ABRIL', 'MAIO', 'JUNHO', 'JULHO', 'AGOSTO', 'SETEMBRO', 'OUTUBRO', 'NOVEMBRO', 'DEZEMBRO'];
    const heads = []; let profX = null;
    lines.forEach(l => l.items.forEach(i => {
      const n = norm(i.str); const mi = MN.indexOf(n);
      if (mi >= 0) heads.push({ mes: mi + 1, x: i.x, y: l.y });
      if (n.startsWith('PROFESSOR')) profX = i.x;
    }));
    if (!heads.length) throw new Error('Não encontrei datas nem um calendário por mês neste PDF.');
    const hy = Math.max(...heads.map(h => h.y));
    const aulas = []; let turno = '', professor = '';
    const tm = allText.match(/(\d{1,2}:\d{2})\s*(?:às|as|a|-|–)\s*(\d{1,2}:\d{2})/i);
    lines.filter(l => l.y > hy).forEach(l => {
      if (!turno) turno = periodo(l.text);
      l.items.forEach(i => {
        if (/^\d{1,2}$/.test(i.str)) {
          let best = null, bd = Infinity;
          heads.forEach(h => { const d = Math.abs(h.x - i.x); if (d < bd) { bd = d; best = h; } });
          if (best && bd < 80) aulas.push({ data: isoOf(+i.str, best.mes, year), turno: '', conteudo: 'Aula', professor: '', bibliografia: '' });
        }
      });
      if (profX != null) {
        const pt = l.items.filter(i => i.x >= profX - 80 && /[A-Za-zÀ-ÿ]{2,}/.test(i.str)).map(i => i.str).join(' ');
        if (pt && !/PROFESSOR/i.test(pt)) professor = (professor + ' ' + pt).trim();
      }
    });
    aulas.forEach(a => { a.turno = turno; a.professor = professor; });
    const r = finish(nome, aulas);
    const ini = tm ? tm[1] : TURNO[turno][0], fim = tm ? tm[2] : TURNO[turno][1];
    if (r.aulas.length < 4) r.horarios = []; else r.horarios.forEach(h => { h.inicio = ini; h.fim = fim; });
    return r;
  }

  // ---- blocks by vertical gap ----
  const gaps = lines.slice(1).map((l, i) => l.y - lines[i].y).filter(g => g > 0.5 && g < 9000).sort((a, b) => a - b);
  const lh = gaps.length ? gaps[Math.floor(gaps.length / 2)] : 12;
  const blocks = [];
  lines.forEach((l, i) => {
    if (i && l.y - lines[i - 1].y <= lh * 1.5) blocks[blocks.length - 1].push(l);
    else blocks.push([l]);
  });
  const rows = new Map();
  const add = (a, l) => { if (!rows.has(a)) rows.set(a, []); rows.get(a).push(l); };
  blocks.forEach(b => {
    const as = b.filter(l => l.datas);
    if (!as.length) {
      let best = null, bd = Infinity; const c = (b[0].y + b[b.length - 1].y) / 2;
      anchors.forEach(a => { const d = Math.abs(a.y - c); if (d < bd) { bd = d; best = a; } });
      if (best && bd < lh * 3) b.forEach(l => add(best, l));
      return;
    }
    b.forEach(l => {
      let best = as[0];
      for (let k = 1; k < as.length; k++) { if (l.y >= (as[k - 1].y + as[k].y) / 2) best = as[k]; }
      add(best, l);
    });
  });

  // ---- rows -> aulas (split into sub-rows by period words) ----
  const WD = '(SEGUNDA|TERCA|QUARTA|QUINTA|SEXTA|SABADO|DOMINGO)(-FEIRA)?';
  const startsPeriodRe = new RegExp('^\\s*(?:' + WD + '\\s+)?(MANHA|TARDE|NOITE)\\b');
  const aulas = [];
  anchors.forEach(a => {
    const ls = (rows.get(a) || [a]).sort((x, y) => x.y - y.y);
    const subs = []; let cur = null;
    ls.forEach(l => {
      const t = l === a ? a.rest : l.text;
      if (!l.datas && /^(DATA|DIA DO|TEMA|SEMANA|TURNO|PER[IÍ]ODO)\b/i.test(t)) return;
      if (!l.datas && l.y < anchors[0].y - lh * 2.2) return;
      const sp = startsPeriodRe.test(norm(t));
      const per = periodo(t);
      if (!cur || (sp && cur.turno && per !== cur.turno)) { cur = { turno: per, parts: [] }; subs.push(cur); }
      else if (!cur.turno && per) cur.turno = per;
      cur.parts.push(t);
    });
    subs.forEach(s => {
      const txt = clean(s.parts.join(' '));
      if (!txt) return;
      a.datas.forEach(d => aulas.push({ data: d, turno: s.turno, conteudo: txt, professor: '', bibliografia: '' }));
    });
  });
  return finish(nome, aulas);
}

/* ===================== sync (Firebase Realtime Database via REST) ===================== */
const DB_URL = 'https://cronograma-giuli-default-rtdb.firebaseio.com/cronograma.json';
const CLIENT = Math.random().toString(36).slice(2, 10);
let online = false, saveTimer = null, pendingRemote = null;
function setSync(txt, ok) { const el = document.getElementById('sync'); el.textContent = txt; el.classList.toggle('ok', !!ok); }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  state.rev = Date.now(); state.client = CLIENT;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(push, 600);
}
async function push() {
  try {
    setSync('Salvando…', false);
    const r = await fetch(DB_URL, { method: 'PUT', body: JSON.stringify(state) });
    if (!r.ok) throw new Error(r.status);
    online = true; setSync('Sincronizado', true);
  } catch (e) { online = false; setSync('Sem conexão — salvo só neste aparelho', false); }
}
const arr = v => Array.isArray(v) ? v : (v && typeof v === 'object' ? Object.values(v) : []);
function normalize(data) {
  data.disciplinas = arr(data.disciplinas).map(d => Object.assign({ id: uid(), nome: '', turma: '' }, d, { horarios: arr(d.horarios), aulas: arr(d.aulas).map(a => Object.assign({ data: '', turno: '', conteudo: '', professor: '', bibliografia: '' }, a)) }));
  return data;
}
function applyRemote(data) {
  if (!data || !data.rev) return;
  normalize(data);
  if (data.client === CLIENT && data.rev === state.rev) return;
  const ae = document.activeElement;
  const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA') && ae.closest('#discList, .modal');
  state = data;
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  if (typing) { pendingRemote = true; return; }
  render();
}
document.addEventListener('focusout', () => { if (pendingRemote) { pendingRemote = false; setTimeout(render, 100); } });
async function initSync() {
  try {
    setSync('Conectando…', false);
    const r = await fetch(DB_URL);
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    online = true;
    if (data && data.rev) applyRemote(data);
    else await push();
    setSync('Sincronizado', true);
    listen();
  } catch (e) { online = false; setSync('Sem conexão — salvo só neste aparelho', false); setTimeout(initSync, 15000); }
}
function listen() {
  try {
    const es = new EventSource(DB_URL);
    const onEv = ev => {
      try {
        const msg = JSON.parse(ev.data);
        if (msg.path === '/') applyRemote(msg.data);
        else fetch(DB_URL).then(r => r.json()).then(applyRemote).catch(() => {});
      } catch (e) {}
    };
    es.addEventListener('put', onEv);
    es.addEventListener('patch', onEv);
    es.onerror = () => { setSync('Reconectando…', false); };
    es.onopen = () => { setSync('Sincronizado', true); };
  } catch (e) { setInterval(() => fetch(DB_URL).then(r => r.json()).then(applyRemote).catch(() => {}), 10000); }
}
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function br(isoStr) { if (!isoStr) return ''; const [y, m, d] = isoStr.split('-'); return `${d}/${m}/${y}`; }
function toIso(v) {
  if (v instanceof Date) return iso(v);
  v = String(v || '').trim();
  let m = v.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if (m) { let y = m[3]; if (y.length === 2) y = '20' + y; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
  return '';
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 3200); }
function tagFor(txt) {
  const n = (txt || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
  if (/FERIADO|DIA DO PROFESSOR|FIM DO SEMESTRE|ULTIMO DIA/.test(n)) return '<span class="tag fer">Feriado</span>';
  if (/ATIVIDADE PARA NOTA|ATIVIDADE PONTUADA|PROVA|\bAV ?\d|\bP[12]\b|\bPOF\b|SIMULADO|AVALIACAO|SEMINARIO|\d[°º] ATIVIDADE|VALENDO NOTA|OSCE/.test(n)) return '<span class="tag aval">Avaliação</span>';
  return '';
}

/* ===================== week view ===================== */
let modeW = 'todas';
function weekGrid(weekStart, nDays, today, keep) {
  let html = '', count = 0;
  for (let i = 0; i < nDays; i++) {
    const d = addDays(weekStart, i), dIso = iso(d), dia = i + 1;
    if (keep && !keep(dIso)) continue;
    count++;
    const itens = [];
    state.disciplinas.forEach(disc => {
      const hs = disc.horarios.filter(h => h.dia === dia);
      const used = new Set();
      disc.aulas.forEach((a, idx) => {
        if (a.data !== dIso) return;
        let h = hs.find(x => a.turno && turnoOf(x) === a.turno) || (!a.turno ? hs[0] : null);
        if (h) used.add(h);
        const ini = a.turno && TURNOS[a.turno] ? TURNOS[a.turno][0] : (h ? h.inicio : '');
        const fim = a.turno && TURNOS[a.turno] ? TURNOS[a.turno][1] : (h ? h.fim : '');
        itens.push({ disc, ini, fim, idx, aula: a, turno: a.turno });
      });
      const anyAula = disc.aulas.some(a => a.data === dIso);
      hs.forEach(h => {
        if (used.has(h)) return;
        if (anyAula && disc.aulas.some(a => a.data === dIso && !a.turno)) return;
        if (anyAula && !turnoOf(h)) return;
        itens.push({ disc, ini: h.inicio, fim: h.fim, idx: -1, aula: null, turno: turnoOf(h) });
      });
    });
    itens.sort((a, b) => (a.ini || '').localeCompare(b.ini || ''));
    html += `<div class="day${dIso === today ? ' today' : ''}"><h2><b>${d.getDate()}</b>${DIAS[dia]}</h2>`;
    if (!itens.length) html += `<div class="empty">Sem aulas</div>`;
    itens.forEach(it => {
      const a = it.aula;
      html += `<div class="aula">
        <div class="hora">${esc(it.ini)}${it.fim ? ' – ' + esc(it.fim) : ''}${it.turno ? ' · ' + turnoLabel(it.turno) : ''}</div>
        <div class="nome">${esc(it.disc.nome)}${a ? tagFor(a.conteudo) : ''}</div>
        ${a ? `<div class="cont${a.conteudo.length > 150 || (a.conteudo.match(/\n/g) || []).length > 2 ? ' clamp' : ''}">${esc(a.conteudo)}</div>${a.conteudo.length > 150 || (a.conteudo.match(/\n/g) || []).length > 2 ? '<button class="more">Ler mais</button>' : ''}` : `<div class="cont none">Sem conteúdo cadastrado para esta data</div>`}
        ${a && a.professor ? `<div class="prof">${esc(a.professor)}</div>` : ''}
        ${a && a.bibliografia ? `<details><summary>Bibliografia</summary><div>${esc(a.bibliografia)}</div></details>` : ''}
        <button class="edit" data-disc="${it.disc.id}" data-idx="${it.idx}" data-data="${dIso}" data-turno="${it.turno || ''}">${a ? 'Editar' : 'Adicionar conteúdo'}</button>
      </div>`;
    });
    html += `</div>`;
  }
  if (!count) return null;
  return `<div class="grid${nDays === 6 ? ' six' : ''}">` + html + `</div>`;
}
function renderWeek() {
  const hasSab = state.disciplinas.some(d => d.horarios.some(h => h.dia === 6));
  const nDays = hasSab ? 6 : 5;
  const today = iso(new Date());
  const curStart = mondayOf(new Date());
  const datas = state.disciplinas.flatMap(d => d.aulas.map(a => a.data)).filter(Boolean).sort();
  let first = datas.length ? mondayOf(new Date(datas[0] + 'T12:00')) : curStart;
  let last = datas.length ? mondayOf(new Date(datas[datas.length - 1] + 'T12:00')) : curStart;
  if (curStart < first) first = curStart;
  if (curStart > last) last = curStart;
  const weeks = [];
  for (let w = new Date(first); w <= last; w = addDays(w, 7)) weeks.push(new Date(w));
  const curIso = iso(curStart);
  let show, keep;
  if (view === 'passadas') { show = weeks.filter(w => iso(w) <= curIso).reverse(); keep = d => d < today; }
  else { show = modeW === 'atual' ? weeks.filter(w => iso(w) === curIso) : weeks.filter(w => iso(w) >= curIso); keep = modeW === 'atual' ? null : d => d >= today; }
  document.getElementById('modeW').classList.toggle('hidden', view === 'passadas');
  document.getElementById('todayW').classList.toggle('hidden', view === 'passadas');
  const rangeTxt = view === 'passadas' ? `${show.length} semana(s) que já passaram` : modeW === 'atual' ? 'Semana atual' : `${show.length} semana(s) daqui pra frente`;
  document.getElementById('range').textContent = rangeTxt;
  document.getElementById('printTitle').textContent = view === 'passadas' ? 'Cronograma — semanas anteriores' : modeW === 'atual' ? `Cronograma — semana de ${br(curIso)}` : 'Cronograma — semana atual e próximas';
  if (!show.length) { document.getElementById('grid').innerHTML = `<div class="note">${view === 'passadas' ? 'Nenhuma semana passou ainda.' : 'Nenhuma semana cadastrada daqui pra frente.'}</div>`; return; }
  const blocks = show.map(w => {
    const g = weekGrid(w, nDays, today, keep);
    if (!g) return '';
    const n = weeks.findIndex(x => iso(x) === iso(w)) + 1;
    const isCur = iso(w) === curIso;
    return `<section class="semana${isCur ? ' cur' : ''}" id="w-${iso(w)}"><h3><b>Semana ${n}</b><span>${br(iso(w))} a ${br(iso(addDays(w, nDays - 1)))}${isCur ? ' · semana atual' : ''}</span></h3>${g}</section>`;
  }).filter(Boolean);
  if (!blocks.length) { document.getElementById('grid').innerHTML = `<div class="note">${view === 'passadas' ? 'Nenhum dia de aula passou ainda.' : 'Nenhuma aula cadastrada daqui pra frente.'}</div>`; return; }
  document.getElementById('grid').innerHTML = blocks.join('');
}
function scrollToday() {
  const el = document.getElementById('w-' + iso(mondayOf(new Date())));
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ===================== disciplinas view ===================== */
function renderDisc() {
  const el = document.getElementById('discList');
  document.getElementById('printTitle').textContent = 'Cronograma completo por disciplina';
  if (!state.disciplinas.length) {
    el.innerHTML = `<div class="note"><b>Nenhuma disciplina ainda.</b>Toque em "Importar PDF / Excel" e escolha os PDFs de cronograma da faculdade (pode selecionar vários de uma vez). Cada PDF vira uma disciplina com seu dia, horário e o conteúdo de cada data. Você também pode criar uma disciplina do zero em "Nova disciplina".</div>`;
    return;
  }
  el.innerHTML = state.disciplinas.map(d => `
    <div class="disc" data-disc="${d.id}">
      <div class="head">
        <input class="nome" data-f="nome" value="${esc(d.nome)}" placeholder="Nome da disciplina">
        <input class="turma" data-f="turma" value="${esc(d.turma)}" placeholder="Turma">
      </div>
      <div class="hor">
        <span>Horário:</span>
        ${d.horarios.map((h, i) => `
          <select data-h="${i}" data-f="dia">${[1, 2, 3, 4, 5, 6].map(n => `<option value="${n}"${h.dia === n ? ' selected' : ''}>${DIAS[n]}</option>`).join('')}</select>
          <input type="time" data-h="${i}" data-f="inicio" value="${esc(h.inicio)}">
          <input type="time" data-h="${i}" data-f="fim" value="${esc(h.fim)}">
          <button class="x" data-delh="${i}" title="Remover horário">×</button>`).join('')}
        <button class="btn" data-addh>+ horário</button>
      </div>
      <div class="rows">
        <div class="h">Data</div><div class="h">Conteúdo</div><div class="h">Professor(a)</div><div class="h">Bibliografia</div><div class="h"></div>
        ${d.aulas.map((a, i) => `
          <div class="row">
            <div><span class="lbl">Data</span><input type="date" data-a="${i}" data-f="data" value="${esc(a.data)}"><select data-a="${i}" data-f="turno" style="margin-top:4px;width:100%;border:1px solid var(--line);border-radius:6px;padding:5px;background:var(--paper)"><option value="">Turno: —</option><option value="manha"${a.turno === 'manha' ? ' selected' : ''}>Manhã</option><option value="tarde"${a.turno === 'tarde' ? ' selected' : ''}>Tarde</option><option value="noite"${a.turno === 'noite' ? ' selected' : ''}>Noite</option></select></div>
            <div><span class="lbl">Conteúdo</span><textarea data-a="${i}" data-f="conteudo">${esc(a.conteudo)}</textarea></div>
            <div><span class="lbl">Professor(a)</span><textarea data-a="${i}" data-f="professor">${esc(a.professor)}</textarea></div>
            <div><span class="lbl">Bibliografia</span><textarea class="bib" data-a="${i}" data-f="bibliografia">${esc(a.bibliografia)}</textarea></div>
            <div><button class="x" data-dela="${i}" title="Remover aula">×</button></div>
          </div>`).join('')}
      </div>
      <div class="foot">
        <button class="btn" data-adda>+ aula</button>
        <button class="btn danger" data-deld>Remover disciplina</button>
      </div>
    </div>`).join('');
}
function findDisc(id) { return state.disciplinas.find(d => d.id === id); }

document.getElementById('discList').addEventListener('input', e => {
  const card = e.target.closest('.disc'); if (!card) return;
  const d = findDisc(card.dataset.disc); const f = e.target.dataset.f; if (!d || !f) return;
  if (e.target.dataset.h !== undefined) { const h = d.horarios[+e.target.dataset.h]; h[f] = f === 'dia' ? +e.target.value : e.target.value; }
  else if (e.target.dataset.a !== undefined) { d.aulas[+e.target.dataset.a][f] = e.target.value; }
  else d[f] = e.target.value;
  save();
});
document.getElementById('discList').addEventListener('click', e => {
  const card = e.target.closest('.disc'); if (!card) return;
  const d = findDisc(card.dataset.disc); const b = e.target.closest('button'); if (!d || !b) return;
  if (b.dataset.addh !== undefined) d.horarios.push({ dia: 1, inicio: '07:50', fim: '11:30' });
  else if (b.dataset.delh !== undefined) d.horarios.splice(+b.dataset.delh, 1);
  else if (b.dataset.adda !== undefined) { const last = d.aulas[d.aulas.length - 1]; const nd = last && last.data ? iso(addDays(new Date(last.data + 'T12:00'), 7)) : ''; d.aulas.push({ data: nd, turno: last ? last.turno || '' : '', conteudo: '', professor: last ? last.professor : '', bibliografia: '' }); }
  else if (b.dataset.dela !== undefined) { if (confirm('Remover esta aula?')) d.aulas.splice(+b.dataset.dela, 1); else return; }
  else if (b.dataset.deld !== undefined) { if (confirm(`Remover a disciplina "${d.nome}"?`)) state.disciplinas = state.disciplinas.filter(x => x !== d); else return; }
  else return;
  save(); renderDisc();
});

/* ===================== modal ===================== */
document.getElementById('grid').addEventListener('click', e => {
  const m = e.target.closest('button.more');
  if (m) { const c = m.previousElementSibling; const open = c.classList.toggle('clamp'); m.textContent = open ? 'Ler mais' : 'Ler menos'; return; }
  const b = e.target.closest('button.edit'); if (!b) return;
  const d = findDisc(b.dataset.disc); if (!d) return;
  editing = { disc: d, idx: +b.dataset.idx, data: b.dataset.data };
  const a = editing.idx >= 0 ? d.aulas[editing.idx] : { data: editing.data, turno: b.dataset.turno || '', conteudo: '', professor: (d.aulas.find(x => x.professor) || {}).professor || '', bibliografia: '' };
  document.getElementById('mTurno').value = a.turno || '';
  document.getElementById('mTitle').textContent = d.nome;
  document.getElementById('mData').value = a.data;
  document.getElementById('mCont').value = a.conteudo;
  document.getElementById('mProf').value = a.professor;
  document.getElementById('mBib').value = a.bibliografia;
  document.getElementById('backdrop').classList.add('on');
  document.getElementById('mCont').focus();
});
document.getElementById('mCancel').onclick = () => document.getElementById('backdrop').classList.remove('on');
document.getElementById('backdrop').addEventListener('click', e => { if (e.target.id === 'backdrop') document.getElementById('backdrop').classList.remove('on'); });
document.getElementById('mSave').onclick = () => {
  if (!editing) return;
  const a = { data: document.getElementById('mData').value, turno: document.getElementById('mTurno').value, conteudo: document.getElementById('mCont').value.trim(), professor: document.getElementById('mProf').value.trim(), bibliografia: document.getElementById('mBib').value.trim() };
  if (editing.idx >= 0) editing.disc.aulas[editing.idx] = a; else editing.disc.aulas.push(a);
  editing.disc.aulas.sort((x, y) => (x.data || '').localeCompare(y.data || ''));
  save(); document.getElementById('backdrop').classList.remove('on'); renderWeek(); toast('Salvo');
};

/* ===================== import ===================== */
document.getElementById('btnImport').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  let ok = 0;
  for (const f of files) {
    try {
      if (/\.pdf$/i.test(f.name)) { await importPdf(f); ok++; }
      else if (/\.xlsx?$/i.test(f.name)) { await importXlsx(f); ok++; }
      else toast(`Formato não suportado: ${f.name}`);
    } catch (err) { console.error(err); alert(`Não consegui importar "${f.name}".\n${err.message || err}`); }
  }
  if (ok) { save(); view = 'semana'; render(); setTimeout(scrollToday, 50); toast(`${ok} arquivo(s) importado(s)`); }
});

function upsertDisc(nd) {
  const norm = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const ex = state.disciplinas.find(d => norm(d.nome) === norm(nd.nome));
  if (ex) { ex.turma = nd.turma || ex.turma; ex.horarios = nd.horarios.length ? nd.horarios : ex.horarios; ex.aulas = nd.aulas; }
  else state.disciplinas.push({ id: uid(), nome: nd.nome, turma: nd.turma || '', horarios: nd.horarios, aulas: nd.aulas });
}

async function importPdf(file) {
  if (!window.pdfjsLib) throw new Error('A biblioteca de leitura de PDF não carregou. Verifique a conexão com a internet e recarregue a página.');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const vp = page.getViewport({ scale: 1 });
    const tc = await page.getTextContent();
    const items = tc.items.filter(it => it.str && it.str.trim()).map(it => ({
      x: it.transform[4],
      top: vp.height - it.transform[5] - (it.height || 10) * 0.8,
      str: it.str
    }));
    pages.push({ h: vp.height, items });
  }
  const total = pages.reduce((n, p) => n + p.items.length, 0);
  if (total < 20) throw new Error('Este PDF parece ser uma imagem (escaneado). Só consigo ler PDFs com texto selecionável.');
  const base = file.name.replace(/\.pdf$/i, '');
  let parsed;
  try { parsed = parseCronograma(pages, base); } catch (e1) { parsed = parseGenerico(pages, base); }
  if (!parsed.aulas.length) throw new Error('Não encontrei nenhuma data na tabela do cronograma.');
  upsertDisc(parsed);
}

async function importXlsx(file) {
  if (!window.XLSX) throw new Error('A biblioteca de leitura de Excel não carregou. Verifique a conexão e recarregue a página.');
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const pick = (row, ...names) => { for (const k of Object.keys(row)) { const nk = norm(k); if (names.some(n => nk.startsWith(n))) return row[k]; } return ''; };
  const discs = {};
  const getD = name => discs[norm(name)] || (discs[norm(name)] = { nome: name, turma: '', horarios: [], aulas: [] });
  let found = false;
  wb.SheetNames.forEach(sn => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { defval: '' });
    if (!rows.length) return;
    const keys = Object.keys(rows[0]).map(norm);
    if (keys.some(k => k.startsWith('data')) && keys.some(k => k.startsWith('conteudo'))) {
      found = true;
      rows.forEach(r => {
        const nome = pick(r, 'disciplina', 'materia') || sn;
        const d = getD(nome);
        if (!d.turma) d.turma = pick(r, 'turma');
        const data = toIso(pick(r, 'data'));
        const conteudo = String(pick(r, 'conteudo'));
        if (!data && !conteudo) return;
        const tn = norm(pick(r, 'turno')); const turno = tn.startsWith('man') ? 'manha' : tn.startsWith('tar') ? 'tarde' : tn.startsWith('noi') ? 'noite' : '';
        d.aulas.push({ data, turno, conteudo, professor: String(pick(r, 'professor')), bibliografia: String(pick(r, 'bibliografia')) });
      });
    } else if (keys.some(k => k.startsWith('dia')) && keys.some(k => k.startsWith('inicio'))) {
      rows.forEach(r => {
        const nome = pick(r, 'disciplina', 'materia'); if (!nome) return;
        const d = getD(nome);
        const dv = pick(r, 'dia'); const dn = norm(dv);
        let dia = parseInt(dv, 10);
        if (isNaN(dia)) dia = ['segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'].findIndex(x => dn.startsWith(x)) + 1;
        if (!dia) return;
        const fmt = v => v instanceof Date ? `${String(v.getHours()).padStart(2, '0')}:${String(v.getMinutes()).padStart(2, '0')}` : String(v || '').slice(0, 5);
        d.horarios.push({ dia, inicio: fmt(pick(r, 'inicio')), fim: fmt(pick(r, 'fim')) });
      });
    }
  });
  if (!found) throw new Error('A planilha precisa ter uma aba com as colunas Data e Conteúdo (o Excel salvo por esta página já vem nesse formato).');
  Object.values(discs).forEach(d => {
    const ex = state.disciplinas.find(x => norm(x.nome) === norm(d.nome));
    if (!d.horarios.length && ex) d.horarios = ex.horarios;
    upsertDisc(d);
  });
}

/* ===================== export ===================== */
document.getElementById('btnXlsx').onclick = () => {
  if (!window.XLSX) return alert('A biblioteca de Excel não carregou. Verifique a conexão e recarregue a página.');
  const aulas = [['Disciplina', 'Turma', 'Data', 'Turno', 'Conteúdo', 'Professor(a)', 'Bibliografia']];
  const hor = [['Disciplina', 'Dia', 'Início', 'Fim']];
  state.disciplinas.forEach(d => {
    d.aulas.forEach(a => aulas.push([d.nome, d.turma, br(a.data), turnoLabel(a.turno), a.conteudo, a.professor, a.bibliografia]));
    d.horarios.forEach(h => hor.push([d.nome, DIAS[h.dia], h.inicio, h.fim]));
  });
  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet(aulas); ws1['!cols'] = [{ wch: 30 }, { wch: 10 }, { wch: 12 }, { wch: 8 }, { wch: 50 }, { wch: 28 }, { wch: 60 }];
  const ws2 = XLSX.utils.aoa_to_sheet(hor); ws2['!cols'] = [{ wch: 30 }, { wch: 10 }, { wch: 8 }, { wch: 8 }];
  XLSX.utils.book_append_sheet(wb, ws1, 'Aulas');
  XLSX.utils.book_append_sheet(wb, ws2, 'Horários');
  XLSX.writeFile(wb, `cronograma-${iso(new Date())}.xlsx`);
};
document.getElementById('btnPdf').onclick = () => {
  let st = document.getElementById('pageStyle');
  if (!st) { st = document.createElement('style'); st.id = 'pageStyle'; document.head.appendChild(st); }
  st.textContent = view === 'semana' ? '@page{size:A4 landscape;margin:10mm}' : '@page{size:A4 portrait;margin:10mm}';
  window.print();
};

/* ===================== misc controls ===================== */
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { view = t.dataset.view; render(); });
document.getElementById('todayW').onclick = () => { if (modeW !== 'todas') { modeW = 'todas'; document.getElementById('modeW').value = 'todas'; renderWeek(); } scrollToday(); };
document.getElementById('modeW').onchange = e => { modeW = e.target.value; renderWeek(); };
document.getElementById('btnAddDisc').onclick = () => {
  state.disciplinas.push({ id: uid(), nome: 'Nova disciplina', turma: '', horarios: [{ dia: 1, inicio: '07:50', fim: '11:30' }], aulas: [] });
  save(); view = 'disciplinas'; render();
};
document.getElementById('btnClear').onclick = () => {
  if (confirm('Apagar todas as disciplinas e aulas em TODOS os aparelhos? Se quiser, salve um Excel antes.')) { state = { disciplinas: [] }; save(); render(); }
};

function render() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === view));
  document.getElementById('viewSemana').classList.toggle('hidden', view === 'disciplinas');
  document.getElementById('viewDisciplinas').classList.toggle('hidden', view !== 'disciplinas');
  if (view === 'disciplinas') renderDisc(); else renderWeek();
}
load();
if (!state.disciplinas.length) view = 'disciplinas';
render();
initSync();
if (view === 'semana') setTimeout(scrollToday, 50);
</script>
